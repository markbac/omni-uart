site_name: OmniUART Protocol Engineering & Telemetry Tool
site_description: Universal schema-driven UART protocol tool for embedded systems, IoT devices, and hardware test engineering.
site_author: Mark Bacon
site_url: https://markbac.github.io/omni-uart/

theme:
  name: material
  palette:
    scheme: slate
    primary: sky
    accent: emerald
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.def_mermaid
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Manual & Quickstart: release/guidance.md
  - System Architecture: architecture/system-architecture.md
  - Protocol Schema Specification: specs/protocol-schema-specification.md
  - Automation Script Specification: specs/script-schema-specification.md
  - Hardware Protocols & AsyncAPI: protocols/index.md
