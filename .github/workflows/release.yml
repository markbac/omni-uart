name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive_name: omni-uart-windows-amd64.zip
          - os: ubuntu-latest
            archive_name: omni-uart-linux-amd64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller

      - name: Compile Standalone Executables (CLI, Web UI, Desktop UI) via PyInstaller
        run: |
          pyinstaller omniuart.spec

      - name: Verify Binary Startup Execution
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/test_binary_smoke.py

      - name: Package Binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/omni-uart-cli.exe", "dist/omni-uart-web.exe", "dist/omni-uart-desktop.exe", "docs/release/guidance.md", "README.md", "LICENSE" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package Binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/omni-uart-cli dist/omni-uart-web dist/omni-uart-desktop
          tar -czvf ${{ matrix.archive_name }} -C dist omni-uart-cli omni-uart-web omni-uart-desktop -C .. docs/release/guidance.md README.md LICENSE

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Issue-Based Release Notes
        run: |
          python scripts/generate_release_notes.py

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Copy Guidance Documentation
        run: |
          cp docs/release/guidance.md release-artifacts/RELEASE_GUIDANCE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
