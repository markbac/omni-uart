name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  lint-pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify Conventional Commits PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            core
            codec
            crc
            transport
            runner
            cli
            ui
            recorder
            spec
            deps
            docs
            packaging
            release
            standards
            diagrams
            ^#\d+$
          allowRegexScope: true
          requireScope: false

  lint-and-validate:
    name: Lint & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] ruff mypy jsonschema pyyaml

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run mypy
        run: |
          mypy src

      - name: Validate Example Protocols with OmniUART Linter
        run: |
          python -c "
          from pathlib import Path
          from omniuart.linter import lint_protocol_file

          for p in Path('examples/protocols').glob('*.*'):
              if p.suffix in ['.json', '.yaml', '.yml']:
                  valid, errs = lint_protocol_file(p)
                  assert valid, f'{p.name} failed linting: {errs}'
                  print(f'Validated protocol: {p.name}')
          "

      - name: Validate Example Scripts
        run: |
          python -c "
          from pathlib import Path
          from omniuart.core.models import load_script

          for s in Path('examples/scripts').glob('*.*'):
              if s.suffix in ['.json', '.yaml', '.yml']:
                  script = load_script(s)
                  assert script is not None and script.steps
                  print(f'Validated script: {s.name}')
          "

      - name: Validate AsyncAPI Specifications (#337)
        run: |
          python -c "
          from pathlib import Path
          from omniuart.core.catalog import CatalogManager
          from omniuart.core.asyncapi_exporter import export_asyncapi_dict
          catalog = CatalogManager()
          sample_protocols = ['binary_sensor_node.yaml', 'ascii_device.yaml', 'custom_crc_device.yaml']
          for p_name in sample_protocols:
              spec = catalog.get_protocol(p_name, first=True)
              assert spec is not None, f'Protocol {p_name} not found'
              doc = export_asyncapi_dict(spec)
              assert doc['asyncapi'] == '2.6.0'
              assert 'info' in doc and 'channels' in doc and 'components' in doc
              print(f'Validated AsyncAPI export for: {p_name}')
          "

      - name: Check Optional tshark PCAPNG Dissector (#212, #337)
        continue-on-error: true
        run: |
          if command -v tshark >/dev/null 2>&1; then
            echo "tshark is available"
            tshark -v
          else
            echo "tshark not installed in runner (optional PCAPNG validation skipped)"
          fi

  benchmarks:
    name: Performance Benchmarks & Targets (#224, #340)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Benchmark Suite & Compare Targets
        env:
          PYTHONPATH: src
        run: |
          python -m omniuart.benchmarks --compare-baseline

  docs-lint:
    name: Docs Lint (py-doc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VALE_VERSION: "3.15.2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # py-doc is a tool, not a project dependency: it pins its own ctxlogkit commit, which pip
      # cannot install beside omni-uart's unpinned one, so it gets an environment of its own.
      - name: Install py-doc and Vale
        run: |
          python -m pip install --upgrade pip
          pip install "py-doc @ git+https://github.com/markbac/py-doc"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check lint engines
        run: py-doc lint --check-engines

      - name: Lint documentation
        run: py-doc lint . --strict --format github

  test:
    name: Test Suite Matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller

      - name: Run pytest test suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest

      - name: Summarise failures as annotations
        if: failure()
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q --tb=short -p no:cacheprovider 2>&1 | grep -v "^SKIPPED" | tail -60 > pytest-failures.txt || true
          msg=$(python -c "print(open('pytest-failures.txt', errors='replace').read().replace('%','%25').replace('\r','').replace('\n','%0A')[:3500])")
          echo "::error title=pytest failures::$msg"

  verify-standalone-binaries:
    name: Build & Verify PyInstaller Standalone Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller

      - name: Compile Standalone Binaries (CLI, Web UI, Desktop UI)
        run: |
          pyinstaller omniuart.spec

      - name: Execute Binary Smoke Verification Test Suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/test_binary_smoke.py

  verify-wheel-package:
    name: Build & Verify Wheel Package (Clean venv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel package
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in clean virtualenv and verify commands
        run: |
          python -m venv test_env
          . test_env/bin/activate
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          omniuart --help
          omniuart list
          omniuart docs --all --output-dir ./docs_site
          test -f ./docs_site/index.html
          test -f ./docs_site/protocols/index.html
          python -c "
          import omniuart
          from omniuart.core.catalog import CatalogManager
          from omniuart.linter import load_kit_schema, lint_protocol_file
          catalog = CatalogManager()
          protocols = catalog.list_protocol_files()
          assert len(protocols) >= 30, f'Expected >= 30 protocols in wheel, got {len(protocols)}'
          schema = load_kit_schema(False)
          assert isinstance(schema, dict) and ('properties' in schema or 'title' in schema)
          valid, errs = lint_protocol_file(protocols[0])
          assert valid, f'Lint failed on bundled protocol: {errs}'
          print('Wheel validation succeeded with', len(protocols), 'protocols')
          "
