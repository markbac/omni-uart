name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify Conventional Commits PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            core
            codec
            crc
            transport
            runner
            cli
            ui
            recorder
            spec
            deps
            docs
            packaging
            release
            standards
            diagrams
          requireScope: false

  lint-and-validate:
    name: Lint & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] ruff mypy jsonschema pyyaml

      - name: Run Ruff Linter
        run: |
          ruff check . || true

      - name: Validate Example Protocols with OmniUART Linter
        run: |
          python -c "
          from pathlib import Path
          from omniuart.linter import lint_protocol_file

          for p in Path('examples/protocols').glob('*.*'):
              if p.suffix in ['.json', '.yaml', '.yml']:
                  valid, errs = lint_protocol_file(p)
                  assert valid, f'{p.name} failed linting: {errs}'
                  print(f'Validated protocol: {p.name}')
          "

      - name: Validate Example Scripts
        run: |
          python -c "
          from pathlib import Path
          from omniuart.core.models import load_script

          for s in Path('examples/scripts').glob('*.*'):
              if s.suffix in ['.json', '.yaml', '.yml']:
                  script = load_script(s)
                  assert script is not None and script.steps
                  print(f'Validated script: {s.name}')
          "

  test:
    name: Test Suite Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pytest test suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest
