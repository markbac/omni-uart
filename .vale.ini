StylesPath = styles
MinAlertLevel = suggestion
Vocab = ProjectTerms

Packages = Microsoft, Google, proselint, https://github.com/krishnasunkam/vale-ai-tells/releases/latest/download/AiTells.zip

[*.md]
BasedOnStyles = Microsoft, Google, proselint, AiTells, Embedded

# Microsoft's style is written for consumer-facing Windows/web docs. These
# rules are dropped or replaced by an Embedded equivalent so the style
# suits formal engineering specifications instead.

# Contractions: Microsoft *requires* them for a friendly tone; a formal ICD
# wants the opposite. Replaced by Embedded.NoContractions.
Microsoft.Contractions = NO
Google.Contractions = NO

# Acronyms: Microsoft/Google flag the same thing with a narrower exceptions
# list. Replaced by Embedded.Acronyms with a wider pattern and an editable
# exceptions list for this project.
Microsoft.Acronyms = NO
Google.Acronyms = NO

# Spelling: Google's default rule pushes American spelling (colour ->
# color, etc.), which fights British English. Replaced by Embedded.Spelling,
# backed by an en_GB Hunspell dictionary. proselint.Spelling is kept - it
# only checks a document isn't mixing both spellings of the same word,
# which is spelling-neutral.
Google.Spelling = NO

# Google.DateFormat wants American 'July 31, 2016' style and rejects UK
# date format ('8 June 2026') outright, at error severity - same mismatch
# as Google.Spelling, just for dates instead of spelling.
Google.DateFormat = NO
Microsoft.DateFormat = NO

# Google.Colons and Microsoft.HeadingColons directly disagree on whether
# the word after a colon in a heading should be capitalised ("Option A:
# Sequential ID" vs "Option A: sequential ID"). Keeping Microsoft's - it
# reads more naturally for "Label: Description"-style headings.
Google.Colons = NO

Microsoft.We = NO
Google.We = NO
Microsoft.FirstPerson = NO
Google.FirstPerson = NO

# Passive voice: Microsoft, Google, and AiTells all flag the same
# sentences under different names. Keep one (Google's has the clearest
# message) to avoid triple-reporting every passive sentence.
Microsoft.Passive = NO
AiTells.Passive = NO

# Dashes and semicolons: two or three packages flag the same locations
# under different rule names. Keep one voice per issue instead of
# reporting the same sentence multiple times.
Microsoft.Dashes = NO
AiTells.Dash = NO
# (Google.EmDash kept)
Google.Semicolons = NO
# (Microsoft.Semicolon kept - "try to simplify this sentence" is more
# actionable than "use semicolons judiciously")

# Google.Parens ("use parentheses judiciously") fires on every clarifying
# parenthetical - register names, object IDs, units - which an ICD uses
# constantly and legitimately. Volume suggests it's fighting the document's
# actual style rather than catching real problems.
Google.Parens = NO

# Microsoft.Uppercase flags two-or-more adjacent all-caps words as
# "shouting", including two adjacent acronyms (FW FOTA) or RFC 2119 pairs
# (MUST NOT) - both common in this project's prose, neither is emphasis.
# Replaced by Embedded.Uppercase, which requires three or more.
Microsoft.Uppercase = NO

# Google.WordListCase is Google's Android/Cloud consumer-app terminology
# list (application -> app, above -> preceding, abort -> stop/exit/...) -
# wrong domain for a formal embedded-systems ICD.
Google.WordListCase = NO

# Google.Headings / Microsoft.Headings: 208 of 209 hits were the exact
# same heading flagged by both. Keep Microsoft's (matches the colon-
# capitalisation convention already chosen elsewhere in this file, and
# its 'suggestion' severity fits this project better than Google's
# 'warning').
Google.Headings = NO

# Google.Latin / Microsoft.Foreign: 100% overlap (both catch e.g./i.e.).
# Keep Google's - its regex also catches the abbreviation at the end of
# a heading or table cell, which Microsoft's misses.
Microsoft.Foreign = NO

# Google.LyHyphens / Microsoft.Hyphens: identical regex, identical
# message, identical auto-fix - only severity differs (error vs warning).
# 'doesn't need a hyphen' is a minor punctuation nit, not error-worthy.
Google.LyHyphens = NO

# Google.AMPM / Microsoft.AMPM / proselint.DateSpacing: all three fire on
# the same missing-space-before-AM/PM instances. Keep Google's (clearest
# message, tightest pattern).
Microsoft.AMPM = NO
proselint.DateSpacing = NO

# Microsoft.Accessibility flags 'Disabled'/'Mute' as ableist language, but
# every hit here is a technical state value (a resource name, a boolean
# field state), not a description of a person - guaranteed to keep
# recurring in a spec full of boolean state fields.
Microsoft.Accessibility = NO

# AiTells.WeakResume is built for CV/resume writing ('responsible for' ->
# 'lead with a quantified outcome'). Applied to a glossary describing what
# system components do, the advice doesn't even make sense in context.
AiTells.WeakResume = NO

# AiTells.EpigramContrast wants the negated half of 'X, not Y' sentences
# cut for punchier prose - but in a spec, 'ECAT is a derived value, not a
# directly writable resource' is a load-bearing technical constraint, not
# rhetorical flourish. Following this rule's advice would delete real
# information, not tighten prose.
AiTells.EpigramContrast = NO

# AiTells.LinkText's 'this document' token isn't scoped to actual link
# syntax - it matches the bare phrase anywhere, and a spec says 'this
# document' constantly in normal self-referential prose, not as vague
# link text.
AiTells.LinkText = NO

# Microsoft.DateOrder flags a literal debug-log timestamp example ('Wed
# Mar 09 2022 10:23:12') for not spelling out the month - it's not prose,
# spelling it out would misrepresent the actual log format shown.
Microsoft.DateOrder = NO

# Google.Anthropomorphism flags ordinary technical phrasing ('which tells
# the server that...') as attributing human qualities to software - too
# mild and common a usage to be worth flagging.
Google.Anthropomorphism = NO

# Google.OptionalPlurals / Microsoft.Plurals: identical complaint about
# '(s)' parenthetical plurals (e.g. 'wake(s)'), from two packages. Keep
# Google's - it names the actual word and has an auto-fix action.
Microsoft.Plurals = NO

# proselint.RASSyndrome flags redundant acronym+word pairs ('LCD display').
# Technically correct but low value here - disabled per request.
proselint.RASSyndrome = NO

# proselint.Typography rewrites hex literals (0x20) into an invalid
# multiplication sign. Replaced by Embedded.Typography, which excludes
# 0x-prefixed tokens from that specific swap.
proselint.Typography = NO

# proselint.Annotations includes NOTE as a "leftover TODO" marker, which
# collides with this project's required [!NOTE] admonition syntax - every
# hit was a real admonition, not a leftover note. Replaced by
# Embedded.Annotations, which drops NOTE and keeps XXX/FIXME/TODO.
proselint.Annotations = NO

# Google.Ordinal is 'error' severity for a minor style nit (spell out
# '1st' as 'first'). Replaced by Embedded.Ordinal at 'warning'.
Google.Ordinal = NO

# Google.Passive: legitimate detections, but passive voice is often the
# right choice in a spec ('the value is embedded in the payload') - a
# blanket style opinion that doesn't fit this genre well at 400+ hits.
Google.Passive = NO

# Microsoft.Semicolon: every single hit says the literal, identical
# "Try to simplify this sentence." with no specifics (no %s in the rule's
# own message) - unactionable at scale, you'd have to read all of them.
Microsoft.Semicolon = NO

# Microsoft.Headings: flags appendix/scenario titles ('Appendix A -
# Registration Request', 'B.1 - Scheduled Session: ...') that
# conventionally stay title-case as structural labels, and re-flags
# legitimately repeated subsection titles ('Server-Side Handling' x3+)
# with no equivalent to MD024's siblings_only allowance.
Microsoft.Headings = NO

# Microsoft.Negative wants negative numbers written with an en dash
# instead of a hyphen-minus - unheard-of in engineering/RF measurements
# ('-97 dBm', '-40 C'); this is a print-typography convention, not a
# technical-writing one.
Microsoft.Negative = NO

# Google.Quotes / Microsoft.Quotes want punctuation moved inside closing
# quotes. Fine for ordinary prose, but this document quotes literal
# values constantly (OTP strings, data array elements); moving a period
# or comma inside one of those would silently corrupt the value it's
# quoting, not just look wrong. Genuine prose-quote cases get fixed by
# hand instead.
Google.Quotes = NO
Microsoft.Quotes = NO

# Microsoft.HeadingAcronyms ("avoid acronyms in a heading") is close to
# unavoidable for a spec whose headings are things like "Issuer
# identification number (IIN)" - not actionable at this volume.
Microsoft.HeadingAcronyms = NO

# Microsoft.Vocab just says "verify your use of X with the A-Z word list"
# with no concrete correction - a nudge to go check, not a finding.
# Microsoft.SentenceLength just says "keep sentences short" with no number.
# Replaced by Embedded.SentenceLength, which reports the actual word count.
# To change the threshold, edit `max:` in styles/Embedded/SentenceLength.yml
# (currently 30 - same as Microsoft's default).
Microsoft.SentenceLength = NO

Microsoft.Vocab = NO