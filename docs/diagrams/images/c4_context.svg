<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="875px" preserveAspectRatio="none" style="width:677px;height:875px;background:#FFFFFF;" version="1.1" viewBox="0 0 677 875" width="677px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="5"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="349.2959" x="160.4673" y="24.5332">System Context Diagram for OmniUART (C4 Level 1)</text></g><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.3848" x="5" y="56.0664">An error has occurred!</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="226.7813" x="5" y="71.1602">I know a UDP joke, but you might not get it</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="86.2539">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.7656" x="5" y="101.3477">PlantUML (1.2026.6) has crashed.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="116.4414">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="131.5352">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="320.7246" x="5" y="146.6289">This version of PlantUML is 246 days old, so you should</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="322.6641" x="5" y="161.7227">consider upgrading from https://plantuml.com/download</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.7832" x="5" y="176.8164">Diagram size: 914 lines / 17323 characters.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="191.9102">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.4492" x="5" y="207.0039">For some reason, dot/GraphViz has crashed.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="222.0977">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.1719" x="5" y="237.1914">RootCause net.sourceforge.plantuml.svek.EmptySvgException</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="270.8027" x="5" y="252.2852">net.sourceforge.plantuml.svek.EmptySvgException</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="519.5977" x="11.668" y="267.3789">net.sourceforge.plantuml.svek.GraphvizImageBuilder.buildImage(GraphvizImageBuilder.java:282)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="591.5625" x="11.668" y="282.4727">net.sourceforge.plantuml.svek.CucaDiagramFileMakerSvek.getTextBlock(CucaDiagramFileMakerSvek.java:82)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="326.1387" x="11.668" y="297.5664">net.atmp.CucaDiagram.getTextBlock(CucaDiagram.java:480)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="378.8438" x="11.668" y="312.6602">net.sourceforge.plantuml.UgDiagram.getExporter(UgDiagram.java:121)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="388.834" x="11.668" y="327.7539">net.sourceforge.plantuml.UgDiagram.exportDiagram(UgDiagram.java:93)</text><text fill="#000000" font-family="sans-