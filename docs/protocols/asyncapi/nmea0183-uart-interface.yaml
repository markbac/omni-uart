asyncapi: 2.6.0
info:
  title: NMEA 0183
  version: '4.11'
  description: ASCII, delimiter-framed sentence protocol used by GPS/marine navigation
    equipment. No commands/responses in the request-reply sense -- the device streams
    sentences unsolicited.
servers:
  serial_link:
    url: serial://tty/4800
    protocol: serial
    description: Physical UART Transport (4800 bps, 8N1.0)
    bindings:
      serial:
        baudRate: 4800
        dataBits: 8
        parity: none
        stopBits: 1.0
        framingType: delimited
        integrity: xor
channels:
  omniuart/telemetry/GGA:
    subscribe:
      summary: 'Unsolicited telemetry message GGA (ID: GPGGA)'
      description: Global Positioning System Fix Data, e.g. $GPGGA,123519,4807.038,N,01131.000,E,1,08,0.9,545.4,M,46.9,M,,*47
      message:
        name: GGA_Telemetry_Message
        title: GGA Telemetry
        payload:
          $ref: '#/components/schemas/GGA_Telemetry'
components:
  messages: {}
  schemas:
    GGA_Telemetry:
      type: object
      properties:
        utcTime:
          type: string
        latitude:
          type: string
        latitudeHemisphere:
          type: string
        longitude:
          type: string
        longitudeHemisphere:
          type: string
        fixQuality:
          type: string
        satellitesUsed:
          type: string
        hdop:
          type: string
        altitude:
          type: string
        altitudeUnits:
          type: string
          default: M
      description: Global Positioning System Fix Data, e.g. $GPGGA,123519,4807.038,N,01131.000,E,1,08,0.9,545.4,M,46.9,M,,*47
