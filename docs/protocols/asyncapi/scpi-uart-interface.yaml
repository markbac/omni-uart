asyncapi: 2.6.0
info:
  title: SCPI (Standard Commands for Programmable Instruments) over RS-232
  version: SCPI-99 / IEEE 488.2
  description: ASCII line-based instrument control (oscilloscopes, PSUs, DMMs). Baud
    is configured manually on both sides -- no auto-negotiation -- and commonly must
    match exactly or the instrument just doesn't respond, with no error reported at
    all. Chains multiple independent commands onto one physical line via ';', which
    compoundMessageDelimiter exists specifically for.
  contact:
    name: Mark Bacon
servers:
  serial_link:
    url: serial://tty/9600
    protocol: serial
    description: Physical UART Transport (9600 bps, 8N1.0)
    bindings:
      serial:
        baudRate: 9600
        dataBits: 8
        parity: none
        stopBits: 1.0
        framingType: delimited
        integrity: none
channels:
  omniuart/cmd/Identify:
    publish:
      summary: 'Send command Identify (ID: *IDN?)'
      description: '*IDN? System identification query.'
      message:
        name: Identify_Message
        title: Identify Command
        payload:
          $ref: '#/components/schemas/Identify_Request'
  omniuart/cmd/Reset:
    publish:
      summary: 'Send command Reset (ID: *RST)'
      description: '*RST System reset command.'
      message:
        name: Reset_Message
        title: Reset Command
        payload:
          $ref: '#/components/schemas/Reset_Request'
  omniuart/cmd/ClearStatus:
    publish:
      summary: 'Send command ClearStatus (ID: *CLS)'
      description: '*CLS Clear status registers.'
      message:
        name: ClearStatus_Message
        title: ClearStatus Command
        payload:
          $ref: '#/components/schemas/ClearStatus_Request'
  omniuart/cmd/MeasureVoltageDC:
    publish:
      summary: 'Send command MeasureVoltageDC (ID: MEAS:VOLT:DC?)'
      description: MEAS:VOLT:DC? Measure DC voltage in Volts.
      message:
        name: MeasureVoltageDC_Message
        title: MeasureVoltageDC Command
        payload:
          $ref: '#/components/schemas/MeasureVoltageDC_Request'
  omniuart/cmd/MeasureCurrentDC:
    publish:
      summary: 'Send command MeasureCurrentDC (ID: MEAS:CURR:DC?)'
      description: MEAS:CURR:DC? Measure DC current in Amperes.
      message:
        name: MeasureCurrentDC_Message
        title: MeasureCurrentDC Command
        payload:
          $ref: '#/components/schemas/MeasureCurrentDC_Request'
  omniuart/cmd/SetVoltageOutput:
    publish:
      summary: 'Send command SetVoltageOutput (ID: SOUR:VOLT )'
      description: SOUR:VOLT <val> Set programmable power supply output voltage.
      message:
        name: SetVoltageOutput_Message
        title: SetVoltageOutput Command
        payload:
          $ref: '#/components/schemas/SetVoltageOutput_Request'
components:
  messages: {}
  schemas:
    Identify_Request:
      type: object
      properties:
        command_id:
          type: integer
          const: '*IDN?'
          description: Opcode ID for Identify
        text:
          type: integer
      description: '*IDN? System identification query.'
    Reset_Request:
      type: object
      properties:
        command_id:
          type: integer
          const: '*RST'
          description: Opcode ID for Reset
        text:
          type: integer
      description: '*RST System reset command.'
    ClearStatus_Request:
      type: object
      properties:
        command_id:
          type: integer
          const: '*CLS'
          description: Opcode ID for ClearStatus
        text:
          type: integer
      description: '*CLS Clear status registers.'
    MeasureVoltageDC_Request:
      type: object
      properties:
        command_id:
          type: integer
          const: MEAS:VOLT:DC?
          description: Opcode ID for MeasureVoltageDC
        text:
          type: integer
      description: MEAS:VOLT:DC? Measure DC voltage in Volts.
    MeasureCurrentDC_Request:
      type: object
      properties:
        command_id:
          type: integer
          const: MEAS:CURR:DC?
          description: Opcode ID for MeasureCurrentDC
        text:
          type: integer
      description: MEAS:CURR:DC? Measure DC current in Amperes.
    SetVoltageOutput_Request:
      type: object
      properties:
        command_id:
          type: integer
          const: 'SOUR:VOLT '
          description: Opcode ID for SetVoltageOutput
        prefix:
          type: integer
        voltage:
          type: integer
      description: SOUR:VOLT <val> Set programmable power supply output voltage.
